function anEff(st, range) {
  const att = anAttempts(st, range);
  const tries = sum(att, a => a.tries), ok = sum(att, a => a.ok);
  const by = {}; att.forEach(a => { const e = by[a.techId] || (by[a.techId] = { tries: 0, ok: 0 }); e.tries += a.tries; e.ok += a.ok; });
  const rows = sortBy(Object.entries(by), ([, e]) => -e.tries);
  const byPos = {}; att.forEach(a => { const t = Q.tech(a.techId); const p = t && t.startPos; if (!p) return; const e = byPos[p] || (byPos[p] = { tries: 0, ok: 0 }); e.tries += a.tries; e.ok += a.ok; });
  const B = buckets(range);
  const rate = B.map(b => { const l = att.filter(a => b.test(a.date)); const t = sum(l, a => a.tries); return t ? Math.round(sum(l, a => a.ok) / t * 100) : null; });
  const vol = B.map(b => sum(att.filter(a => b.test(a.date)), a => a.tries));
  const gi = Q.attempts().filter(a => inRange(a.date, range) && a.discipline === 'gi'), ng = Q.attempts().filter(a => inRange(a.date, range) && a.discipline === 'nogi');
  const M = Q.matches().filter(m => { const c = DB.get('competitions', m.compId); return c && inRange(c.date, range) && (st.disc === 'all' || c.discipline === st.disc || c.discipline === 'both'); });
  const W = M.filter(m => m.result === 'win').length, L = M.filter(m => m.result === 'loss').length, D = M.filter(m => m.result === 'draw').length;
  const meth = countBy(M, m => m.method);
  return `<div class="banner info mb12">${ic('info')}<div>Calculs <b>uniquement à partir des observations enregistrées</b> (rounds détaillés et combats). Seuil d’échantillon : ${smallN()} tentatives (modifiable dans les paramètres).</div></div>
  <div class="grid g4"><div class="kpi"><div class="v">${tries}</div><div class="l">Tentatives observées</div></div><div class="kpi"><div class="v ok">${ok}</div><div class="l">Réussites</div></div><div class="kpi"><div class="v">${tries ? pct(ok, tries) + '<small>%</small>' : '—'}</div><div class="l">Taux global</div>${tries && tries < smallN() ? '<div class="d warn">Échantillon insuffisant</div>' : ''}</div><div class="kpi"><div class="v">${M.length}</div><div class="l">Combats officiels · ${W}V ${L}D${D ? ' ' + D + 'N' : ''}</div></div></div>
  ${!tries && !M.length ? `<div class="mt12">${emptyState('target', 'Aucune observation sur la période. Détaillez vos rounds (techniques tentées / réussies) ou enregistrez des combats pour alimenter cette analyse.')}</div>` : `
  <div class="grid g2 mt12">
    <div class="card">${chartBox('Évolution du taux de réussite', lineChart({ labels: B.map(b => b.l), series: [{ name: 'Taux %', values: rate, color: PAL.ok }], yMax: 100, yFmt: v => Math.round(v) + '%', w: cw(2) }), { name: 'taux-reussite', foot: `Volume d’observations par période : ${vol.map(v => v || 0).join(' · ')}` })}</div>
    <div class="card"><h3 class="mb12">Comparaison Gi / No-Gi</h3><div class="grid g2">
      <div class="kpi"><div class="v" style="color:var(--gi)">${rateTxt(sum(gi, a => a.ok), sum(gi, a => a.tries)).split(' (')[0]}</div><div class="l">Gi · ${sum(gi, a => a.tries)} tentatives</div>${sum(gi, a => a.tries) && sum(gi, a => a.tries) < smallN() ? '<div class="d warn">Échantillon insuffisant</div>' : ''}</div>
      <div class="kpi"><div class="v" style="color:var(--nogi)">${rateTxt(sum(ng, a => a.ok), sum(ng, a => a.tries)).split(' (')[0]}</div><div class="l">No-Gi · ${sum(ng, a => a.tries)} tentatives</div>${sum(ng, a => a.tries) && sum(ng, a => a.tries) < smallN() ? '<div class="d warn">Échantillon insuffisant</div>' : ''}</div></div>
      <div class="divider"></div><h4 class="mb8">Combats officiels</h4>${M.length ? donutBlock([{ label: 'Victoires', value: W, color: PAL.ok }, { label: 'Défaites', value: L, color: PAL.bad }, { label: 'Nuls', value: D, color: PAL.muted }], { center: M.length, centerSub: 'combats', size: 110 }) + `<div class="chips mt8">${Object.entries(meth).map(([k, v]) => `<span class="pill">${esc(MATCH_METHODS[k] || k)} · ${v}</span>`).join('')}</div>` : '<p class="small muted">Aucun combat sur la période.</p>'}</div>

  if (g.positionId && Q.pos(g.positionId)) cur = lvl(Q.pos(g.positionId), g.view || defView());

  }
  let p;

function compStats(M) {
  const W = M.filter(m => m.result === 'win'), L = M.filter(m => m.result === 'loss');
  const att = Q.attempts().filter(a => M.some(m => m.id === a.matchId));
  const by = {}; att.forEach(a => { const e = by[a.techId] || (by[a.techId] = { tries: 0, ok: 0 }); e.tries += a.tries; e.ok += a.ok; });
  return {
    n: M.length, w: W.length, l: L.length, d: M.filter(m => m.result === 'draw').length,
    subsW: W.filter(m => m.method === 'submission').length, subsL: L.filter(m => m.method === 'submission').length,
    ptsF: sum(M, m => m.ptsFor), ptsA: sum(M, m => m.ptsAgainst),
    perf: sortBy(Object.entries(by).filter(([, e]) => e.ok), ([, e]) => -e.ok),
    weak: M.filter(m => m.difficulties).map(m => m.difficulties), subTaken: L.filter(m => m.method === 'submission' && m.submission).map(m => m.submission)
  };
}

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLToBlob(u) {
  const [h, b64] = String(u).split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
A.exportData = async () => {

    data[s] = deep(DB.all(s)).filter(r => !(s === 'preferences' && (r.id === 'obStep')));
  }

  const json = JSON.stringify(out);

  DB.setPref('lastExport', nowISO());
  toast(`Export généré (${fmtN(json.length / 1048576, 2)} Mo)`); if (Q.profile() && Q.profile().onboarded) refresh();
};
function validateImport(o) {
  const errs = [], warns = [];
  if (!o || typeof o !== 'object') return { errs: ['Fichier illisible : ce n’est pas un objet JSON.'], warns };
  if (o.format !== DATA_FORMAT) errs.push(`Format inattendu (« ${esc(o.format || 'absent')} »). Ce fichier n’est pas une sauvegarde FLOWLAB.`);
  if (typeof o.version !== 'number') errs.push('Version absente.');
  else if (o.version > DATA_VERSION) errs.push(`Ce fichier provient d’une version plus récente de FLOWLAB (format v${o.version}, cette application lit jusqu’à v${DATA_VERSION}).`);
  if (!o.data || typeof o.data !== 'object') errs.push('Section « data » absente.');
  if (errs.length) return { errs, warns };
  for (const s of Object.keys(o.data)) if (!STORES.includes(s)) warns.push(`Section inconnue ignorée : ${esc(s)}`);
  for (const s of STORES) {
    const v = o.data[s];
    if (v == null) { warns.push(`Section « ${s} » absente (sera vide).`); continue; }
    if (!Array.isArray(v)) { errs.push(`Section « ${s} » invalide (liste attendue).`); continue; }
    const bad = v.filter(r => !r || typeof r !== 'object' || typeof r.id !== 'string' || !r.id).length;
    if (bad) errs.push(`${bad} enregistrement(s) sans identifiant dans « ${s} ».`);
    const idsSet = new Set(v.map(r => r && r.id)); if (idsSet.size !== v.length) errs.push(`Identifiants en double dans « ${s} ».`);
  }
  if (errs.length) return { errs, warns };
  const D = o.data;
  if (!D.profile.some(p => p.id === 'me')) warns.push('Aucun profil : l’onboarding sera relancé.');
  else if (D.profile.find(p => p.id === 'me').onboarded && !D.baselines.some(b => b.isBaseline)) warns.push('Profil sans baseline initiale.');
  const pos = new Set(D.positions.map(p => p.id)), tech = new Set(D.techniques.map(t => t.id)), ses = new Set(D.trainingSessions.map(s => s.id)), plans = new Set(D.gamePlans.map(p => p.id)), comps = new Set(D.competitions.map(c => c.id));
  const orphanRefs = D.trainingSessions.reduce((n, s) => n + (s.positions || []).filter(id => !pos.has(id)).length + (s.techniques || []).filter(id => !tech.has(id)).length, 0);
  if (orphanRefs) warns.push(`${orphanRefs} référence(s) de séance vers des positions/techniques absentes (affichées comme supprimées).`);
  const orphanRounds = D.trainingRounds.filter(r => !ses.has(r.sessionId)).length; if (orphanRounds) warns.push(`${orphanRounds} round(s) orphelin(s).`);
  const orphanNodes = D.gamePlanNodes.filter(n => !plans.has(n.planId)).length; if (orphanNodes) warns.push(`${orphanNodes} nœud(s) de game plan orphelin(s).`);
  const orphanM = D.matches.filter(m => !comps.has(m.compId)).length; if (orphanM) warns.push(`${orphanM} combat(s) orphelin(s).`);
  if (!o.includesMedia && D.techniques.some(t => (t.media || []).length)) warns.push('Les médias n’ont pas été inclus dans cet export : les images et vidéos ne seront pas restaurées.');
  return { errs, warns };
}

      ${warns.length ? `<div class="banner mt12">${ic('info')}<div><b>Points de vigilance</b><ul style="margin:6px 0 0;padding-left:18px">${warns.map(w => `<li>${w}</li>`).join('')}</ul></div></div>` : `<p class="small ok mt12">${ic('check').replace('<svg', '<svg width="14" height="14" style="display:inline;vertical-align:-2px"')} Format, version et cohérence vérifiés.</p>`}
      ${hasCurrent ? `<button class="btn sm mt12" data-act="exportData">${ic('download')}Exporter d’abord mes données actuelles</button>` : ''}`,
    foot: `<button type="button" class="btn" data-act="closeSheet">Annuler</button><button type="button" class="btn ${hasCurrent ? 'danger' : 'pri'}" data-act="importConfirm">${hasCurrent ? 'Remplacer mes données' : 'Restaurer'}</button>`
  });
  A.importConfirm = async () => {
    try {
      const data = {};
      for (const s of STORES) data[s] = (D[s] || []).map(r => Object.assign({}, r));
      data.media = data.media.filter(m => m.dataURL).map(m => { const c = Object.assign({}, m); try { c.blob = dataURLToBlob(m.dataURL); } catch (e) { c.blob = null; } delete c.dataURL; return c; });
      data.preferences = data.preferences.filter(p => p.id !== 'obStep' && p.id !== 'evDraft');
      MEDIA_URLS.forEach(u => URL.revokeObjectURL(u)); MEDIA_URLS.clear();
      await DB.replaceAll(data);
      closeAllSheets(); applyTheme(); VSTATE = {}; GP.planId = null;
      toast('Données restaurées');
      const p = Q.profile();
      if (p && !p.onboarded) DB.setPref('obStep', 1);
      location.hash = '#/home'; render();
    } catch (e) { console.error(e); toast('Échec de la restauration : ' + e.message, 'bad', 5000); }
  };
};
A.resetAll = async () => {
  if (!await confirmDlg('Tout effacer ?', 'Toutes vos données FLOWLAB seront supprimées de cet appareil : profil, baseline, évaluations, séances, techniques, game plans, objectifs, compétitions. Exportez-les d’abord si vous souhaitez les conserver.', { ok: 'Continuer', danger: true })) return;
  const t = await promptDlg('Confirmation finale', 'Tapez SUPPRIMER pour confirmer', '', { ok: 'Effacer définitivement' });
  if (t !== 'SUPPRIMER') return toast('Suppression annulée', 'bad');
  await DB.clearAll(); VSTATE = {}; GP.planId = null; MEDIA_URLS.clear();
  toast('Toutes les données ont été effacées'); location.hash = ''; render();
};

/* =========================================================================
   DÉMARRAGE
   ========================================================================= */
(async function boot() {
  $('#app').innerHTML = `<div class="welcome"><div class="mark">${LOGO.replace('width="18" height="18"', 'width="36" height="36"')}</div><p class="muted">Chargement…</p></div>`;
  await DB.init();
  applyTheme();
  try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (DB.pref('theme', 'dark') === 'auto') { applyTheme(); refresh(); } }); } catch (e) { }
  if (Q.profile() && Q.profile().onboarded && !location.hash) location.hash = '#/home';
  render();
})();

</script>
</body>
</html>
